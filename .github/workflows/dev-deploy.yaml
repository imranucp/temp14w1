name: dev-deploye-wf
on: 
  push:
    branches:
      - develop
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Build With Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
      - name: Upload Build Artifacts Using Github-Pages-Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dev"
  deploy-job:
    needs: build-job
    permissions:
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Going to Deploy Site on GH-Pages"
      - name: Use deploye using actions/deploy-pages@v4
        uses: actions/deploy-pages@v4
        with:
          token: ${{github.token}}
      
     
    
      
      
